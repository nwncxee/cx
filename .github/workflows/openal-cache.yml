# Keeps the release job's OpenAL Soft cache alive on main. A tag run restores caches only from its own tag or
# from the default branch, and GitHub evicts a cache nobody touched for 7 days. Releases come further apart than
# that, so this restores the entry twice a week and builds it on a miss. Same key, path and OS as release.yml's
# linux job, or the release run misses it.
name: openal-cache

on:
  schedule:
    - cron: '0 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openal-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - id: openal
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with: { path: build/openal, key: "openal-${{ runner.os }}-${{ hashFiles('tools/deps.json', 'tools/build-openal.sh') }}" }

      - name: Install OpenAL Soft's build dependencies
        if: steps.openal.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libpipewire-0.3-dev libpulse-dev libasound2-dev

      # The same fetch and script build.sh runs when build/openal/libopenal.so.1 is missing.
      - name: Build OpenAL Soft
        if: steps.openal.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python3 tools/deps.py openal-src build/deps
          src=$(echo build/deps/openal-soft-*)
          bash tools/build-openal.sh "$src" build/openal-build build/openal/libopenal.so.1
