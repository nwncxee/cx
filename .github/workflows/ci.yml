# Pull-request validation. `ci` builds the extender and proves it loads C# into a foreign process
# (run-demo.sh, no game needed); there is no unit-test project yet, so the build + load smoke is the gate.
# `windows` builds the Windows leg with build-win-native.sh, the script release.yml ships, beside `ci`.
# tools/ci-changes.sh maps the changed paths to the jobs they reach; a draft runs none of them.
# `no-decompiled` runs the decompiled-code check and the rule gates on every pull request: a listing can
# hide in any file, Markdown included, and checks the decision records. Releases are built by release.yml on a v* tag.
name: ci

# ready_for_review starts the run a draft never had; the other three are the default set.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# One run per ref: a new push obsoletes the run on the old head, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub never reports a workflow that on.pull_request.paths skipped, so a required check would wait
  # forever on a docs-only pull request. This job decides instead, and `ci` reports as skipped.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      build: ${{ steps.match.outputs.build }}
      windows: ${{ steps.match.outputs.windows }}
    steps:
      # A draft fails here and every job needs this one, so a draft runs nothing. Failing, not skipping:
      # a skipped job reports as passed. Marking it ready starts the run that counts.
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs when the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci-changes.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # tools/ci-changes.sh is the map, and tools/ci-changes_approved_examples.sh its sample table.
      - id: match
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | bash tools/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    # The timeout is a crash guard with room for a binary cache miss, which builds OpenAL Soft from source.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # funchook pulls diStorm3 as a nested submodule
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Read-only: CI never pushes to the binary cache. docs/binary-cache.md says when a maintainer refills it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: westgate
          skipPush: true

      # FSR's cache: restored from this pull request's own runs, else from main's (ffx-cache.yml saves it there).
      - uses: ./.github/actions/ffx-cache

      # The gates and approved examples run beside this job, in no-decompiled and examples.
      # run-demo.sh runs what build.sh just staged instead of building it a second time.
      - name: Build + load smoke
        run: |
          nix develop .#ci --command bash -c '
            set -euo pipefail
            ./build.sh --no-gates
            CX_NO_BUILD=1 ./run-demo.sh | tee demo.out
            # The fast self-check path must run what the AOT image runs: the same verdict and the same suites. Not
            # tools/selfcheck/fast_approved_examples.sh: that one needs a systemd user manager and a timing bound.
            tools/selfcheck/run.sh | tee fast.out
            want=$(grep -E "^>> [0-9]+ SelfCheck lines" demo.out)
            got=$(grep -E "^>> [0-9]+ SelfCheck lines" fast.out)
            [ "$want" = "$got" ] || { echo "fast self-checks: \"$got\", run-demo.sh: \"$want\""; exit 1; }
            demolog=$(sed -n "s/^>> \(.*cx\.log\) (written from C#):\$/\1/p" demo.out)
            suites() { grep -o "\[cx\] [A-Za-z0-9_.]*SelfCheck[ :A-Z]*" "$1" | sort | uniq -c; }
            diff <(suites "$demolog") <(suites build/selfcheck/cx.log)
          '

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      # Git for Windows defaults to autocrlf=true; a CRLF submodule tree makes the LF funchook patch not apply.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401 # the SDK flake.lock pins; bump the two together

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build
        shell: bash
        run: ./build-win-native.sh

  # The rules' and build checks' own approved examples need the SDK but not the build, so they run beside it.
  examples:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: westgate
          skipPush: true

      - name: Approved examples
        run: nix develop .#ci --command bash tools/approved-examples.sh

  no-decompiled:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every decision record keeps decision-record's format (docs/adr). Plain bash, so it runs before Nix installs.
      - name: Decision records
        run: bash bin/check-adr docs/adr/*.md

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # flake.nix's gates shell: the pinned Python, git and the workflow linters, nothing that needs a compiler.
      - name: No decompiled code in the tree
        run: nix develop .#gates --command bash -c 'bash tools/no-decompiled-contract.sh && bash tools/no-decompiled.sh'

      # The rule gates (tools/gates/); the build job skips them (build.sh --no-gates) so they run here, in parallel.
      - name: Rule gates
        run: nix develop .#gates --command bash tools/gates/run.sh
