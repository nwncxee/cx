# Releases. A v* tag builds the Linux extender on ubuntu-24.04 and the Windows one natively on
# windows-2025-vs2026 (build-win-native.sh; the Linux cross-build, build-win.sh, is a dev tool and never
# ships), Authenticode-signs its version.dll once a maintainer approves the signing job, zips the Moonglow
# Toolset plugin, attests where every zip came from, and uploads them with
# SHA256SUMS to a draft release. Nothing is public yet: tools/release/sign.sh checks the draft on the
# maintainer's machine, adds SHA256SUMS.sig and publishes it. Releases are immutable, so a published one can't gain, lose or swap an asset.
# Every shipped byte is built in this run from the tagged source; no cache feeds a release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] \
            || { printf "unsupported release tag: %s\n" "$TAG" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build.sh stamps the version from `git describe --tags`
          submodules: recursive # funchook pulls diStorm3 as a nested submodule
          persist-credentials: false

      # Only reviewed code ships: the tag must point at a commit that reached main through a pull request.
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { printf "%s is not on main; tag a commit from main\n" "$TAG" >&2; exit 1; }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401 # the SDK flake.lock pins; bump the two together

      - name: Install native toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld zlib1g-dev cmake pkg-config \
            libpipewire-0.3-dev libpulse-dev libasound2-dev   # OpenAL Soft's backends

      - name: Build + package
        run: |
          set -euo pipefail
          ./build.sh --no-gates # source rules, not build steps: ci / gates ran them on the pull request
          rm -rf dist && mkdir -p dist
          # build.sh zips the CONTENTS of cx-linux-x64/ (flat), so
          # "unpack into bin/linux-x86" is literally the whole install.
          mv cx-linux-x64.zip "dist/cx-linux-x64-${TAG}.zip"

      # Laid out as `mg plugin pack` lays it out (one folder named by the plugin's id), and stamped with the
      # release's version: Moonglow refuses to install a version it already has.
      - name: Package the Moonglow plugin
        run: |
          set -euo pipefail
          id=$(sed -n '/^\[plugin\]/,/^\[/s/^id = "\(.*\)"$/\1/p' moonglow/nwncx/plugin.cfg)
          [[ -n "$id" ]] || { echo "moonglow/nwncx/plugin.cfg names no id" >&2; exit 1; }
          stage=$(mktemp -d)
          cp -r moonglow/nwncx "$stage/$id"
          sed -i "s/^version = .*/version = \"${TAG#v}\"/" "$stage/$id/plugin.cfg"
          (cd "$stage" && zip -qrX "$GITHUB_WORKSPACE/dist/cx-moonglow-plugin-${TAG}.zip" "$id")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: linux, path: dist/*.zip, if-no-files-found: error }

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      # Git for Windows defaults to autocrlf=true; a CRLF submodule tree makes the LF funchook patch not apply.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401 # the SDK flake.lock pins; bump the two together

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The symbol gate (tools/abi/check-win-symbols.py) needs llvm-undname and a real nwmain.exe; the
      # runner has neither, so the script skips it. It runs on the dev box via build-win.sh.
      - name: Build + package
        shell: bash
        run: |
          set -euo pipefail
          ./build-win-native.sh
          mkdir -p dist && mv cx-windows-x64.zip "dist/cx-windows-x64-${TAG}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: windows, path: dist/*.zip, if-no-files-found: error }

  # Signs version.dll with the Certum key held in SimplySign's cloud and replaces the windows artifact, so
  # the checksums and the attestation publish makes describe the signed zip.
  sign-windows:
    needs: windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    # Required reviewers: the SimplySign login secrets reach a run only after a maintainer approves it.
    environment: release-signing
    env:
      CERT_SHA1: 5A440C9F40A4DE1161142646A64C11E9E8221DF9
      SSD_VERSION: 9.4.4.92
      SSD_SHA256: 8ec420fc27798b86078b7bd02fe7152097e1b3005bab51820eaca8e57df84da3
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: dist }

      - name: Unpack
        shell: bash
        run: python -m zipfile -e "dist/cx-windows-x64-${TAG}.zip" stage

      # The action installs SimplySign Desktop unchecked; installing it here first pins the installer's bytes.
      - name: Install SimplySign Desktop
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'simplysign.msi'
          Invoke-WebRequest -OutFile $msi -Uri "https://files.certum.eu/software/SimplySignDesktop/Windows/$env:SSD_VERSION/SimplySignDesktop-$env:SSD_VERSION-64-bit-en.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne $env:SSD_SHA256) { Write-Error "SimplySign installer hash $hash, expected $env:SSD_SHA256"; exit 1 }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { Write-Error "msiexec exit $($p.ExitCode)"; exit 1 }

      - id: certum
        uses: jay0lee/certum-cloud-code-sign@a3324503499c49090869856eeeecfe95fb613d87 # main, 2026-09-24
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          totp_secret: ${{ secrets.CERTUM_TOTP_SECRET }}
          version: ${{ env.SSD_VERSION }}
          cert_sha1: ${{ env.CERT_SHA1 }}

      - name: Sign version.dll
        shell: pwsh
        env:
          SIGNTOOL: ${{ steps.certum.outputs.signtool-path }}
        run: |
          & $env:SIGNTOOL sign /sha1 $env:CERT_SHA1 /tr http://time.certum.pl /td sha256 /fd sha256 /v stage\version.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:SIGNTOOL verify /pa /v stage\version.dll
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Log out of SimplySign
        if: always() && steps.certum.conclusion != 'skipped'
        uses: jay0lee/certum-cloud-code-sign/teardown@a3324503499c49090869856eeeecfe95fb613d87 # main, 2026-09-24

      # make_archive, as build-win-native.sh packs it: the zip holds the folder's contents, flat.
      - name: Repack
        shell: bash
        run: |
          set -euo pipefail
          rm "dist/cx-windows-x64-${TAG}.zip"
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'stage')" "dist/cx-windows-x64-${TAG}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: windows, path: dist/*.zip, if-no-files-found: error, overwrite: true }

  publish:
    needs: [linux, sign-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment admits v* tags only, and only admins can push one.
    environment: release
    permissions:
      contents: write # creates the draft release and uploads its assets
      id-token: write # the Sigstore certificate that signs the provenance
      attestations: write # stores the provenance on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog walks back to the previous tag
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }

      - run: cd dist && sha256sum *.zip > SHA256SUMS

      # sign.sh and the README's verify steps check it, pinned to this workflow and the tag.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # A re-run of a failed run refills its draft. A published release is final.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sed "s/@VERSION@/${TAG}/g" packaging/RELEASE-BODY.md > body.md
          # Changelog: the PR titles merged since the previous release; an rc counts back to any tag, a
          # final release to the previous final one. Dependency bumps are not news to players.
          skip=(); [[ "$TAG" == *-rc* ]] || skip=(--exclude='*-rc*')
          prev=$(git describe --tags --abbrev=0 "${skip[@]}" "$TAG^" 2> /dev/null || true)
          {
            printf '\n## Changes%s\n\n' "${prev:+ since $prev}"
            git log --first-parent --format='- %s' "${prev:+$prev..}$TAG" | grep -v '^- Bump ' || true
          } >> body.md
          pre=false; [[ "$TAG" == *-rc* ]] && pre=true
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            [[ "$draft" == true ]] || { printf "%s is already published\n" "$TAG" >&2; exit 1; }
            gh release edit "$TAG" --title "$TAG" --notes-file body.md --prerelease="$pre"
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file body.md --prerelease="$pre"
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "draft $TAG holds: $(ls dist | tr '\n' ' '). Next: tools/release/sign.sh $TAG"
