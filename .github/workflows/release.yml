# Releases. A v* tag builds the Linux extender on ubuntu-24.04 and the Windows one natively on
# windows-2025-vs2026 (build-win-native.sh; the Linux cross-build, build-win.sh, is a dev tool and never
# ships), then publishes both zips + SHA256SUMS to the GitHub release for the tag. The release body comes
# from packaging/RELEASE-BODY.md. tools/release/sign.sh adds SHA256SUMS.sig from the maintainer's machine.
# Tag-gated, never on a pull request.
name: release

on:
  push:
    tags: ['v*']
  # Re-run / backfill an existing tag from main's workflow file (the file at an old
  # tag is the old publish): gh workflow run release --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag: { description: existing v* tag to (re)publish, required: true }

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] \
            || { printf "unsupported release tag: %s\n" "$TAG" >&2; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # build.sh stamps the version from `git describe --tags`
          submodules: recursive # funchook pulls diStorm3 as a nested submodule

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401 # the SDK flake.lock pins; bump the two together

      - name: Install native toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld zlib1g-dev cmake pkg-config \
            libpipewire-0.3-dev libpulse-dev libasound2-dev   # CX-57: OpenAL Soft's backends

      # The built libopenal.so.1: build.sh skips the OpenAL Soft compile when it is present. Keyed on the pin and
      # on the script that holds the cmake flags. openal-cache.yml keeps this entry alive on main, where a tag
      # run can restore it.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with: { path: build/openal, key: "openal-${{ runner.os }}-${{ hashFiles('tools/deps.json', 'tools/build-openal.sh') }}" }

      - name: Build + package
        run: |
          set -euo pipefail
          ./build.sh --no-gates # source rules, not build steps: ci / gates ran them on the pull request
          rm -rf dist && mkdir -p dist
          # build.sh zips the CONTENTS of cx-linux-x64/ (flat), so
          # "unpack into bin/linux-x86" is literally the whole install.
          mv cx-linux-x64.zip "dist/cx-linux-x64-${TAG}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: linux, path: dist/*.zip, if-no-files-found: error }

  windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      # Git for Windows defaults to autocrlf=true; a CRLF submodule tree makes the LF funchook patch not apply.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.401 # the SDK flake.lock pins; bump the two together

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # The symbol gate (tools/abi/check-win-symbols.py) needs llvm-undname and a real nwmain.exe; the
      # runner has neither, so the script skips it. It runs on the dev box via build-win.sh.
      - name: Build + package
        shell: bash
        run: |
          set -euo pipefail
          ./build-win-native.sh
          mkdir -p dist && mv cx-windows-x64.zip "dist/cx-windows-x64-${TAG}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows, path: dist/*.zip, if-no-files-found: error }

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the only job that writes: it creates the release and uploads its assets
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: "${{ env.TAG }}" }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, merge-multiple: true }

      # Idempotent: a workflow_dispatch re-run edits the existing release and replaces same-name assets.
      - name: Publish to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ( cd dist && sha256sum *.zip > SHA256SUMS )
          sed "s/@VERSION@/${TAG}/g" packaging/RELEASE-BODY.md > body.md
          pre=false; [[ "$TAG" == *-rc* ]] && pre=true
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file body.md --draft=false --prerelease="$pre"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file body.md --prerelease="$pre"
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "published $TAG with: $(ls dist | tr '\n' ' ')"
