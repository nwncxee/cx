[plugin]
id = "nwncx.area-settings"
name = "NWNCX:EE tools"
version = "0.1.0"
api = "0.3"
license = "MIT"
description = "A set of tools specific to NWNCX:EE"
author = "NWNCX:EE"

[command]
id = "area-settings"
title = "NWNCX:EE Area Settings..."
hint = "Set or clear an area's NWNCX:EE settings (single player only: multiplayer clients never receive area variables)"

[check]
id = "cx-variables"
title = "NWNCX:EE area variables name real settings"
severity = "warning"
